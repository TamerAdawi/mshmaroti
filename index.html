<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fefae0" />
    <meta name="description" content="מעקב משמרות וטיפים — משמרותי · payroll-accurate shift tracking for two-job waitressing" />

    <!-- Open Graph / Twitter — so the link doesn't preview as a blank box -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tameradawi.github.io/mshmaroti/" />
    <meta property="og:title" content="Mshmaroti · משמרותי — payroll-accurate shift tracker" />
    <meta property="og:description" content="A Hebrew-first PWA for two-job waitressing: Israeli labour-law overtime, Shabbat premiums and deductions, computed per shift." />
    <meta property="og:image" content="https://tameradawi.github.io/mshmaroti/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mshmaroti · משמרותי — payroll-accurate shift tracker" />
    <meta name="twitter:description" content="Israeli labour-law overtime, Shabbat premiums and deductions, computed per shift." />
    <meta name="twitter:image" content="https://tameradawi.github.io/mshmaroti/og-image.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('mshmaroti-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#1a2110' : '#fefae0')
        } catch (e) {}
      })()
    </script>
    <script>
      // Self-heal: if a stale/broken service-worker cache serves an index.html
      // whose JS chunks are gone, React never mounts and the app "freezes" on
      // open. If nothing has mounted a while after load AND a service worker is
      // controlling the page, purge caches + unregister and reload — once.
      (function () {
        var KEY = 'mshmaroti-heal'
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (root && root.children.length > 0) {
              try { sessionStorage.removeItem(KEY) } catch (e) {}
              return
            }
            if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return
            try { if (sessionStorage.getItem(KEY) === '1') return } catch (e) { return }
            try { sessionStorage.setItem(KEY, '1') } catch (e) {}
            var jobs = [
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister() }))
              }).catch(function () {}),
            ]
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k) }))
              }).catch(function () {}))
            }
            var reload = function () { location.reload() }
            Promise.all(jobs).then(reload, reload)
          }, 10000)
        })
      })()
    </script>
    <title>משמרותי</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Rubik:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
